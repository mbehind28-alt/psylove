<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LoveSync | Psychology Love Meter + Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #fce4ec 0%, #ffe0e7 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Tab Navigation */
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: #880e4f;
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            opacity: 0.7;
        }
        .tab-btn.active {
            background: #e91e63;
            opacity: 1;
            box-shadow: 0 4px 15px rgba(233,30,99,0.3);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Common Styles */
        .hero {
            text-align: center;
            margin-bottom: 32px;
        }
        .hero h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #c2185b, #e91e63);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .hero p {
            color: #ad1457;
            font-weight: 500;
        }
        .card {
            background: rgba(255, 250, 245, 0.96);
            border-radius: 48px;
            padding: 28px 26px;
            margin-bottom: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
        }
        .card h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #880e4f;
            border-left: 6px solid #f06292;
            padding-left: 18px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            color: #4a154b;
            margin-bottom: 6px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1.5px solid #ffb7c5;
            background: #fff0f5;
            font-size: 1rem;
            outline: none;
        }
        .input-group input:focus {
            border-color: #e91e63;
        }
        button {
            background: #e91e63;
            color: white;
            border: none;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        button:hover {
            background: #c2185b;
            transform: scale(0.98);
        }
        .love-result {
            background: #fce4ec;
            border-radius: 40px;
            padding: 22px;
            margin-top: 22px;
            text-align: center;
        }
        .percentage {
            font-size: 3.6rem;
            font-weight: 800;
            color: #d81b60;
        }
        .psycho-message {
            font-size: 1.1rem;
            font-style: italic;
            background: white;
            padding: 16px;
            border-radius: 32px;
            margin: 16px 0;
        }
        .love-cycle {
            font-weight: bold;
            color: #880e4f;
            background: #ffe4e9;
            padding: 12px;
            border-radius: 32px;
        }
        .logout-area {
            text-align: right;
            margin-bottom: 16px;
        }
        .logout-btn {
            width: auto;
            background: #b71c1c;
            padding: 8px 22px;
            font-size: 0.85rem;
        }
        .info-note {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 20px;
            color: #a55;
        }
        /* Admin Panel Styles */
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: #1a1a3e;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            color: white;
        }
        .stat-box h3 {
            font-size: 1.8rem;
            color: #ffd966;
        }
        .admin-table {
            overflow-x: auto;
        }
        .admin-table table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
        }
        .admin-table th, .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            font-size: 0.8rem;
        }
        .admin-table th {
            background: #880e4f;
            color: white;
        }
        .message-item {
            background: #f3e5f5;
            padding: 10px;
            margin: 8px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-small {
            width: auto;
            padding: 5px 12px;
            font-size: 0.7rem;
            margin: 2px;
        }
        .btn-green {
            background: #2e7d32;
        }
        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .password-cell {
            background: #fff3e0;
            font-family: monospace;
            font-weight: bold;
        }
        .action-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .bg-reg { background: #2e7d32; color: white; }
        .bg-login { background: #0288d1; color: white; }
        .bg-love { background: #c2185b; color: white; }
        .bg-admin { background: #ff8c00; color: white; }
        @media (max-width: 768px) {
            .tab-btn { padding: 8px 16px; font-size: 0.8rem; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Tab Buttons -->
    <div class="tab-buttons">
        <button class="tab-btn active" id="tabMainBtn">💖 Love Meter Website</button>
        <button class="tab-btn" id="tabAdminBtn">🔐 Admin Panel</button>
    </div>

    <!-- Main Website Tab -->
    <div id="mainTab" class="tab-content active">
        <div id="mainAppRoot"></div>
    </div>

    <!-- Admin Panel Tab -->
    <div id="adminTab" class="tab-content">
        <div id="adminAppRoot"></div>
    </div>
</div>

<script>
    // ==================== STORAGE KEYS ====================
    const USERS_KEY = 'lovesync_users_detailed';
    const SESSION_KEY = 'lovesync_session';
    const ACTIVITY_KEY = 'lovesync_activity_detailed';
    const LOVE_HISTORY_KEY = 'lovesync_love_history';
    const MESSAGES_KEY = 'lovesync_messages';
    
    // ==================== ADMIN CREDENTIALS (As per your request) ====================
    // ID: achutapradhan56@gmail.com , Password: RAJPRADHAN78
    const ADMIN_ID = "achutapradhan56@gmail.com";
    const ADMIN_PASSWORD = "RAJPRADHAN78";
    const ADMIN_SESSION_KEY = 'lovesync_admin_session';

    // ==================== DEFAULT MESSAGES ====================
    function getDefaultPsychologyMessages() {
        return [
            "💞 Secure Attachment Style: You both share trust, emotional availability & genuine warmth. This is the healthiest bond!",
            "🔥 Anxious-Passionate Bond: Intense chemistry and deep emotions. Remember to communicate needs clearly.",
            "🌸 Avoidant-Meets-Secure: Growth journey ahead — patience and understanding bring you closer.",
            "✨ Eros Love: Magnetic attraction, romance and deep desire rule your connection. Physical and emotional sparks fly!",
            "🍃 Ludus Playful Love: Fun, flirty & carefree — keep the spark alive with honesty and commitment.",
            "💜 Agape Love: Selfless & compassionate; you uplift each other's souls. Divine unconditional connection.",
            "🌙 Storge Love: Best friends & steady flame — companionship at its finest. Built on deep friendship.",
            "🧠 Psychology Insight: Your love languages align through acts of service & quality time. Keep nurturing.",
            "🌈 Cosmic Match: Vulnerability is your superpower — keep sharing dreams and fears openly.",
            "💎 Twin Flame Vibration: Mirror each other's strengths and shadows beautifully. Intense spiritual connection.",
            "🦋 Growth-Oriented Love: You challenge each other to become better versions of yourselves.",
            "🌟 Soulmate Recognition: Deep sense of knowing — as if you've met in another lifetime."
        ];
    }

    function getDefaultLoveCycles() {
        return [
            "❤️ Romantic Phase: Butterflies & new discoveries, everything feels magical",
            "🌀 Trust Building Cycle: Deepening emotional safety and vulnerability",
            "⚡ Power Struggle → Learning compromise and healthy boundaries",
            "🌿 Commitment Renewal: Re-choosing each other daily with intention",
            "✨ Synergy Cycle: Creativity & shared joy, building dreams together",
            "🌙 Shadow Integration: Healing old wounds together as a team",
            "🌟 Spiritual Union: Beyond ego, pure soul connection and understanding"
        ];
    }

    function getPsychologyMessages() {
        const stored = localStorage.getItem(MESSAGES_KEY);
        if (stored) {
            const data = JSON.parse(stored);
            return data.psychologyMessages || getDefaultPsychologyMessages();
        }
        return getDefaultPsychologyMessages();
    }

    function getLoveCycles() {
        const stored = localStorage.getItem(MESSAGES_KEY);
        if (stored) {
            const data = JSON.parse(stored);
            return data.loveCycles || getDefaultLoveCycles();
        }
        return getDefaultLoveCycles();
    }

    function saveMessages(psychologyMessages, loveCycles) {
        localStorage.setItem(MESSAGES_KEY, JSON.stringify({ psychologyMessages, loveCycles }));
    }

    // ==================== UTILITIES ====================
    function getUsers() {
        const raw = localStorage.getItem(USERS_KEY);
        return raw ? JSON.parse(raw) : [];
    }

    function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function getSession() {
        const sess = localStorage.getItem(SESSION_KEY);
        return sess ? JSON.parse(sess) : null;
    }

    function setSession(email) {
        if (email) localStorage.setItem(SESSION_KEY, JSON.stringify({ email }));
        else localStorage.removeItem(SESSION_KEY);
    }

    function logActivity(email, action, details = '') {
        let logs = localStorage.getItem(ACTIVITY_KEY);
        let arr = logs ? JSON.parse(logs) : [];
        arr.unshift({
            email,
            action,
            timestamp: new Date().toLocaleString(),
            details,
            id: Date.now()
        });
        if (arr.length > 200) arr.pop();
        localStorage.setItem(ACTIVITY_KEY, JSON.stringify(arr));
    }

    function saveLoveHistory(userEmail, yourName, partnerName, percentage, message, cycle, isAdminOverride = false) {
        let history = localStorage.getItem(LOVE_HISTORY_KEY);
        let arr = history ? JSON.parse(history) : [];
        arr.unshift({
            userEmail,
            yourName,
            partnerName,
            percentage,
            psychologyMessage: message,
            loveCycle: cycle,
            timestamp: new Date().toLocaleString(),
            isAdminOverride
        });
        if (arr.length > 100) arr.pop();
        localStorage.setItem(LOVE_HISTORY_KEY, JSON.stringify(arr));
    }

    function getRandomLoveResult(manualPercentage = null) {
        const psychologyMessages = getPsychologyMessages();
        const loveCycles = getLoveCycles();
        const percent = manualPercentage !== null ? manualPercentage : (Math.floor(Math.random() * 41) + 55);
        const msgIndex = Math.floor(Math.random() * psychologyMessages.length);
        const cycleIndex = Math.floor(Math.random() * loveCycles.length);
        return {
            percentage: percent,
            message: psychologyMessages[msgIndex],
            cycle: loveCycles[cycleIndex]
        };
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ==================== MAIN WEBSITE AUTH ====================
    function renderMainAuth() {
        const root = document.getElementById('mainAppRoot');
        root.innerHTML = `
            <div class="hero">
                <h1>💖 LoveSync · Psychology Love Meter</h1>
                <p>✨ Random love psychology + love cycle + percentage ✨</p>
            </div>
            <div class="card">
                <h2>📝 Register</h2>
                <div class="input-group"><label>Full Name</label><input type="text" id="regName" placeholder="e.g., Rohan Sharma"></div>
                <div class="input-group"><label>Email (Login ID)</label><input type="email" id="regEmail" placeholder="you@example.com"></div>
                <div class="input-group"><label>Password</label><input type="password" id="regPass" placeholder="min 4 characters"></div>
                <button id="registerBtn">💗 Register</button>
            </div>
            <div class="card">
                <h2>🔐 Login</h2>
                <div class="input-group"><label>Email (ID)</label><input type="email" id="loginEmail" placeholder="your@email.com"></div>
                <div class="input-group"><label>Password</label><input type="password" id="loginPass" placeholder="password"></div>
                <button id="loginBtn">✨ Login to Love Meter</button>
            </div>
            <div class="info-note">🔮 Admin Panel available in the tab above</div>
        `;

        document.getElementById('registerBtn').addEventListener('click', () => {
            const fullname = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            if (!fullname || !email || !pass) return alert("Please fill all fields");
            if (pass.length < 4) return alert("Password min 4 chars");
            const users = getUsers();
            if (users.find(u => u.email === email)) return alert("Email already exists. Please login.");
            users.push({ email, password: pass, fullname, registeredAt: new Date().toLocaleString(), loveCalculations: [] });
            saveUsers(users);
            logActivity(email, "REGISTER", `User ${fullname} registered`);
            alert("Registration successful! Please login.");
            document.getElementById('regName').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPass').value = '';
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const users = getUsers();
            const user = users.find(u => u.email === email && u.password === pass);
            if (!user) return alert("Invalid credentials");
            setSession(email);
            logActivity(email, "LOGIN", `User logged in`);
            renderMainApp();
        });
    }

    function renderMainApp() {
        const session = getSession();
        if (!session) { renderMainAuth(); return; }
        const users = getUsers();
        const currentUser = users.find(u => u.email === session.email) || { fullname: session.email, email: session.email };
        const root = document.getElementById('mainAppRoot');
        root.innerHTML = `
            <div class="logout-area"><button class="logout-btn" id="logoutBtnMain">🚪 Logout (${escapeHtml(currentUser.fullname || currentUser.email)})</button></div>
            <div class="hero"><h1>💞 Love Psychology Meter</h1><p>Discover your random love cycle & percentage</p></div>
            <div class="card">
                <h2>💑 Enter Names for Love Calculation</h2>
                <div class="input-group"><label>✨ Your Name</label><input type="text" id="yourName" placeholder="Your name" value="${escapeHtml(currentUser.fullname?.split(' ')[0] || 'Me')}"></div>
                <div class="input-group"><label>🌟 Partner's Name</label><input type="text" id="partnerName" placeholder="e.g., Priya, Aditya"></div>
                <button id="calculateBtn">💘 Calculate Love Destiny</button>
                <div id="loveResultArea"></div>
            </div>
            <div class="info-note">📊 Admin Panel available in the tab above</div>
        `;

        document.getElementById('calculateBtn').addEventListener('click', () => {
            const yourName = document.getElementById('yourName').value.trim();
            const partnerName = document.getElementById('partnerName').value.trim();
            if (!yourName || !partnerName) return alert("Please enter both names 💌");
            const result = getRandomLoveResult();
            let users = getUsers();
            const userIndex = users.findIndex(u => u.email === currentUser.email);
            if (userIndex !== -1) {
                if (!users[userIndex].loveCalculations) users[userIndex].loveCalculations = [];
                users[userIndex].loveCalculations.push({ yourName, partnerName, percentage: result.percentage, psychologyMessage: result.message, loveCycle: result.cycle, timestamp: new Date().toLocaleString() });
                saveUsers(users);
            }
            saveLoveHistory(currentUser.email, yourName, partnerName, result.percentage, result.message, result.cycle);
            logActivity(currentUser.email, "LOVE_CALCULATION", `${yourName} & ${partnerName} = ${result.percentage}%`);
            document.getElementById('loveResultArea').innerHTML = `
                <div class="love-result">
                    <div class="percentage">💖 ${result.percentage}% 💖</div>
                    <div class="psycho-message"><strong>🧠 Psychology Type:</strong> ${result.message}</div>
                    <div class="love-cycle"><strong>🔄 Love Cycle:</strong> ${result.cycle}</div>
                </div>`;
        });
        document.getElementById('logoutBtnMain').addEventListener('click', () => {
            logActivity(currentUser.email, "LOGOUT", "Logged out");
            setSession(null);
            renderMainAuth();
        });
    }

    // ==================== ADMIN PANEL (with your credentials) ====================
    let adminLoggedIn = false;

    function isAdminLoggedIn() {
        return localStorage.getItem(ADMIN_SESSION_KEY) === 'true';
    }

    function setAdminSession(val) {
        localStorage.setItem(ADMIN_SESSION_KEY, va
